<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula06 - site base</title>

    <link rel="stylesheet" href="./aula06.css">

</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2 style="margin-bottom: 10px;">🚀 Painel</h2>
            <div class="menu-item">Inicio</div>
            <div class="menu-item">Analitycs</div>
            <div class="menu-item">Produtos</div>
            <div class="menu-item">Mensagens</div>
            <div class="menu-item">Configurações</div>
        </div>
    

        <div class="main-content">
            <div class="stats-row">
                <div class="stat-box stat-1">
                    <h3>Usuarios Ativos</h3>
                    <p>+8.432</p>
                </div>
                <div class="stat-box stat-2">
                    <h3>Receita Mensal</h3>
                    <p>R$ 45.900</p>
                </div>
                <div class="stat-box stat-3">
                    <h3>Conversão</h3>
                    <p>14,2%</p>
                </div>
            </div>
        </div>

        <div class="grid-row">
            <div class="content-box">
                <h2>Visão Geral do Sistema</h2>
                <p style="color: #94a3b8; line-height: 1.5;">Este painel utiliza caixas organizadoras flexiveis.</p>
                <div class="inner-boxes">
                    <div class="mini-box">Caixa A</div>
                    <div class="mini-box">Caixa B</div>
                    <div class="mini-box">Caixa C</div>
                </div>
            </div>
        </div>

    </div>
    
</body>
</html>
